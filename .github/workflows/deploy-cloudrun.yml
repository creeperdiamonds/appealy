name: Deploy to GCP Cloud Run

# ---------------------------------------------------------------------------
# READ THIS BEFORE DEPLOYING THE BOT
#
# `api` and `web` are a natural fit for Cloud Run: they're request-driven and
# scaling to zero saves real money.
#
# `bot` is not. A Discord gateway connection is a WebSocket that must stay
# open 24/7, and Cloud Run's default behaviour is to throttle CPU to near zero
# between requests and shut the instance down when traffic stops. A gateway bot
# deployed with defaults will connect, go quiet, miss heartbeats, get
# disconnected by Discord, and reconnect in a loop — spending a Discord session
# start each time until the daily budget is gone (see bot/src/core/sharding.ts).
#
# The three flags below are what make it survivable:
#
#   --min-instances=1     never scale to zero
#   --no-cpu-throttling   keep CPU allocated between requests
#   --max-instances=1     two instances = two gateway connections for the same
#                         shard, which Discord will disconnect
#
# Even then, Cloud Run is not really the right home for it — it bills for CPU
# continuously with these flags, so you get e2-micro pricing with more
# complexity. A small Compute Engine VM is cheaper and simpler for the bot.
# Deploy api + web here and put the bot on a VM.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - api
          - web
          - bot
      migrations:
        description: 'apply runs pending migrations before deploying. skip leaves the schema alone. allow-destructive permits DROP/TRUNCATE — read the plan first.'
        required: false
        type: choice
        default: apply
        options:
          - apply
          - skip
          - allow-destructive
      vite_api_url:
        description: '(Web only) Leave EMPTY — the console proxies the API on its own origin'
        required: false
        default: ''
      api_origin:
        description: '(Web only) API service URL that nginx proxies /auth and /api to'
        required: false
        default: 'https://appealy-api-xxxx.a.run.app'

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'your-gcp-project-id' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY || 'us-central1-docker.pkg.dev/your-gcp-project-id/appealy-repo' }}

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Cheap, and it saves a genuinely nasty debugging session. Without it an
      # unset secret produces env_vars containing `TEBEX_PROJECT_ID=`, the
      # build and deploy both succeed, and the container then crash-loops on
      # resolveDeployment()'s "platform mode requires a billing source" — which
      # surfaces as a Cloud Run health check failure, several screens away from
      # the repository setting that caused it.
      - name: Fail early if billing credentials are missing
        if: github.event.inputs.service != 'web'
        env:
          TEBEX_PROJECT_ID: ${{ secrets.TEBEX_PROJECT_ID }}
          TEBEX_PRIVATE_KEY: ${{ secrets.TEBEX_PRIVATE_KEY }}
          TEBEX_WEBHOOK_SECRET: ${{ secrets.TEBEX_WEBHOOK_SECRET }}
        run: |
          # if-blocks rather than `[ -z "$X" ] && missing=...`. This step runs
          # under `bash -e`, where a && chain whose left side is false makes the
          # LINE return 1 and the shell exit — so the terse form aborts the step
          # precisely when the secret is present, which is the one case that
          # should pass.
          missing=""
          if [ -z "$TEBEX_PROJECT_ID" ]; then missing="$missing TEBEX_PROJECT_ID"; fi
          if [ -z "$TEBEX_PRIVATE_KEY" ]; then missing="$missing TEBEX_PRIVATE_KEY"; fi
          if [ -z "$TEBEX_WEBHOOK_SECRET" ]; then missing="$missing TEBEX_WEBHOOK_SECRET"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Settings -> Secrets and variables -> Actions -> Secrets."
            echo "DEPLOYMENT_MODE=platform requires a billing source, so the container"
            echo "would build, deploy, and then fail to start."
            echo "The first two come from creator.tebex.io -> Developers -> API Keys."
            echo "The third is in the settings of the webhook endpoint itself."
            exit 1
          fi

      # Only the migrate step needs it — the services themselves are built
      # inside Docker, which brings its own runtime.
      - name: Set up Node
        if: github.event.inputs.service == 'api' && github.event.inputs.migrations != 'skip'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Authorize Docker push
        run: gcloud auth configure-docker $(echo ${{ env.ARTIFACT_REGISTRY }} | cut -d'/' -f1) --quiet

      - name: Prepare build arguments
        id: prep
        # Mapped into the environment rather than interpolated into the script
        # below. A ${{ secrets.X }} substituted straight into a shell line is
        # text the shell then parses, so a value containing a quote or a
        # backtick stops being data and starts being code. Reading $TEBEX_* is
        # the same value with none of that.
        env:
          TEBEX_PROJECT_ID: ${{ secrets.TEBEX_PROJECT_ID }}
          TEBEX_PRIVATE_KEY: ${{ secrets.TEBEX_PRIVATE_KEY }}
          TEBEX_WEBHOOK_SECRET: ${{ secrets.TEBEX_WEBHOOK_SECRET }}
        run: |
          IMAGE_NAME="${{ env.ARTIFACT_REGISTRY }}/appealy-${{ github.event.inputs.service }}"
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

          # env_vars is emitted as one multi-line output and consumed as a
          # single expression below. Expressions are substituted after the
          # workflow YAML is parsed, so a multi-line value needs no indenting
          # and cannot break the block it lands in.
          {
            echo "env_vars<<APPEALY_EOF"
            echo "NODE_ENV=production"
            echo "APPEALY_ENV=production"
            echo "DEPLOYMENT_MODE=platform"
            echo "LOG_LEVEL=info"
            # Billing, for both services that boot our own code.
            #
            # The bot does not charge anybody and never calls Tebex. It needs
            # these because DEPLOYMENT_MODE=platform is set for every service
            # and resolveDeployment() refuses to start a platform deployment
            # with no billing source — a sensible guard for the API, and one
            # the bot has to satisfy too since it shares the check. Handing the
            # bot a payment key it never uses is not ideal; changing the guard
            # to know which runtime is asking is a bigger change than this one.
            #
            # web is excluded on purpose: it is nginx serving static files, it
            # never runs resolveDeployment, and putting a private key in its
            # service config would be exposure bought for nothing.
            if [ "${{ github.event.inputs.service }}" != "web" ]; then
              echo "TEBEX_PROJECT_ID=${TEBEX_PROJECT_ID}"
              echo "TEBEX_PRIVATE_KEY=${TEBEX_PRIVATE_KEY}"
              echo "TEBEX_WEBHOOK_SECRET=${TEBEX_WEBHOOK_SECRET}"
            fi
            if [ "${{ github.event.inputs.service }}" = "web" ]; then
              # Read by nginx at container start, not baked into the bundle —
              # see web/nginx.conf for why the API is proxied through the
              # console's origin rather than called directly.
              echo "API_ORIGIN=${{ github.event.inputs.api_origin }}"
              # GCP's metadata server. nginx resolves the proxy target at
              # request time, and Docker's 127.0.0.11 does not exist here.
              echo "DNS_RESOLVER=169.254.169.254"
            fi
            echo "APPEALY_EOF"
          } >> $GITHUB_OUTPUT

          case "${{ github.event.inputs.service }}" in
            web)
              # Empty on purpose: the bundle calls /auth and /api as
              # same-origin relative paths so the session cookie stays
              # first-party. Passing a URL here reintroduces the cross-site
              # cookie problem web/nginx.conf exists to avoid.
              echo "build_args=--build-arg VITE_API_URL=${{ github.event.inputs.vite_api_url }}" >> $GITHUB_OUTPUT
              echo "port=8080" >> $GITHUB_OUTPUT
              # 8080, not 80: nginx now templates ${PORT} at container start
              # (web/nginx.conf), and Cloud Run's default is 8080. A container
              # listening on the wrong port fails its health check with no
              # error message that says so.
              # Stateless and request-driven, so scale to zero is correct.
              echo "flags=--port=8080 --min-instances=0 --allow-unauthenticated" >> $GITHUB_OUTPUT
              ;;
            api)
              echo "build_args=" >> $GITHUB_OUTPUT
              echo "port=3001" >> $GITHUB_OUTPUT
              # min-instances=1 avoids a cold start on the OAuth callback,
              # which is the one request a user is actively waiting on.
              echo "flags=--port=3001 --min-instances=1 --allow-unauthenticated" >> $GITHUB_OUTPUT
              ;;
            bot)
              echo "build_args=" >> $GITHUB_OUTPUT
              echo "port=9090" >> $GITHUB_OUTPUT
              # See the header. All three flags are load-bearing.
              # --no-allow-unauthenticated because nothing should reach the
              # bot's internal control server from the internet.
              echo "flags=--port=9090 --min-instances=1 --max-instances=1 --no-cpu-throttling --no-allow-unauthenticated" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Build Docker image
        run: |
          docker build ${{ steps.prep.outputs.build_args }} \
            -t ${{ steps.prep.outputs.image_name }}:${{ github.sha }} \
            -t ${{ steps.prep.outputs.image_name }}:latest \
            -f ${{ github.event.inputs.service }}/Dockerfile .

      - name: Push Docker image
        run: |
          docker push ${{ steps.prep.outputs.image_name }}:${{ github.sha }}
          docker push ${{ steps.prep.outputs.image_name }}:latest

      # Migrations run BEFORE the new container is live, which is correct for
      # additive changes — a new nullable column or table exists by the time
      # anything queries it, and the old container is unaffected because it
      # never mentions them.
      #
      # It is the WRONG order for a destructive change. Dropping a column the
      # currently-running code still selects breaks the old revision during the
      # overlap, before the new one takes traffic. That is why destructive
      # migrations are refused here rather than merely warned about: the safe
      # sequence for them is deploy-then-migrate, run deliberately, not folded
      # into a push.
      #
      # Nothing ran migrations before this existed — not the workflow, not the
      # API at startup. A push that added a column deployed happily and then
      # threw SQL errors at runtime, because deploying and migrating are
      # different things and only one of them was automated.
      - name: Apply database migrations
        if: github.event.inputs.service == 'api' && github.event.inputs.migrations != 'skip'
        working-directory: api
        run: |
          set -eu

          # Scan the SQL rather than trusting the operator to remember. drizzle
          # skips migrations already applied, so a file listed here may well be
          # historical — the point is that a destructive statement exists in the
          # set at all, which is worth a human reading the plan.
          DESTRUCTIVE=$(grep -rilE 'drop[[:space:]]+(table|column)|truncate|alter[[:space:]]+table[^;]*drop' ../db/migrations/*.sql || true)

          if [ -n "$DESTRUCTIVE" ]; then
            if [ "${{ github.event.inputs.migrations }}" != "allow-destructive" ]; then
              echo "::error::Destructive statements found. Re-run with migrations=allow-destructive once you have read them, or migrations=skip to deploy without touching the schema."
              echo "Files:"
              echo "$DESTRUCTIVE" | sed 's/^/  /'
              echo
              echo "For a destructive change the safe order is deploy first, then migrate —"
              echo "otherwise the running revision queries a column that is already gone."
              exit 1
            fi
            echo "::warning::Proceeding with destructive migrations at operator request."
          fi

          # Read here rather than mounting it: this runs on the runner, not in
          # the container, so it needs the connection string in its own
          # environment. The deploy account is granted secretAccessor on this
          # one secret and no other.
          DATABASE_URL=$(gcloud secrets versions access latest \
            --secret=appealy-database-url --project="$GCP_PROJECT_ID" 2>/dev/null || true)
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::appealy-database-url has no value yet — the schema cannot be migrated."
            echo "Add one with:"
            echo "  echo -n 'postgres://...' | gcloud secrets versions add appealy-database-url --data-file=- --project=$GCP_PROJECT_ID"
            echo "Or re-run with migrations=skip to deploy without touching the schema."
            exit 1
          fi
          # Masked explicitly. It was read at runtime rather than passed in as a
          # ${{ secrets.* }} expression, so Actions has never seen the value and
          # does not know to redact it from anything printed later.
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL

          npm ci --omit=optional
          npm run db:migrate

      - name: Deploy to Cloud Run
        id: deploy   # needed for steps.deploy.outputs.url below
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'appealy-${{ github.event.inputs.service }}'
          image: '${{ steps.prep.outputs.image_name }}:${{ github.sha }}'
          region: '${{ env.GCP_REGION }}'
          flags: '${{ steps.prep.outputs.flags }}'

          # Non-secret config only. Built per-service in the prep step above.
          env_vars: ${{ steps.prep.outputs.env_vars }}

          # These come from Secret Manager, NOT from env_vars.
          #
          # Anything in env_vars is stored in the Cloud Run service config in
          # plaintext and visible to anyone with roles/viewer on the project —
          # which is not where a bot token or an AES key belongs. Secret
          # Manager keeps them out of the service definition, gives you access
          # logs, and lets you rotate without redeploying.
          #
          # The TEBEX_* values are the deliberate exception and go through
          # env_vars from GitHub secrets, so that configuring billing does not
          # require gcloud access. That is a real downgrade for those three —
          # they sit in the service config like the rest of env_vars — and it
          # is a considered trade on a single-maintainer project where the only
          # account holding roles/viewer is the maintainer's. Moving them back
          # is reverting one commit.
          #
          # Create them once:
          #   echo -n "$VALUE" | gcloud secrets create discord-bot-token --data-file=-
          # and grant the runtime service account roles/secretmanager.secretAccessor.
          secrets: |
            DATABASE_URL=appealy-database-url:latest
            REDIS_URL=appealy-redis-url:latest
            DISCORD_BOT_TOKEN=appealy-discord-bot-token:latest
            DISCORD_APPLICATION_ID=appealy-discord-application-id:latest
            DISCORD_PUBLIC_KEY=appealy-discord-public-key:latest
            DISCORD_CLIENT_ID=appealy-discord-client-id:latest
            DISCORD_CLIENT_SECRET=appealy-discord-client-secret:latest
            SESSION_SECRET=appealy-session-secret:latest
            TOKEN_ENCRYPTION_KEY=appealy-token-encryption-key:latest
            OPS_USER_IDS=appealy-ops-user-ids:latest

      - name: Print deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
