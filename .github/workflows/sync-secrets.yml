name: Sync secrets to Secret Manager

# ---------------------------------------------------------------------------
# Copies the values already stored as GitHub repository secrets into Secret
# Manager, which is where the deployed containers read them from.
#
# WHY THIS EXISTS
#
# The two stores are unrelated. Setting DISCORD_BOT_TOKEN as a repository
# secret does nothing for a running service, because deploy/service.yaml mounts
# appealy-discord-bot-token from Secret Manager. Without something bridging
# them, every value has to be entered twice — once where it is convenient and
# once where it is actually read — and the second copy silently goes stale.
#
# A workflow can read repository secrets even though a person cannot (they are
# write-only in the UI), so this is the only way to move them across without
# fetching every value from its original source again.
#
# WHY IT IS NOT PART OF THE DEPLOY
#
# Secret Manager bills per active version, and a sync on every deploy would add
# one per secret per push whether or not anything changed. This only writes when
# the value actually differs, and runs when you ask it to.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync
        env:
          P: ${{ vars.GCP_PROJECT_ID }}
          appealy_discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          appealy_discord_application_id: ${{ secrets.DISCORD_APPLICATION_ID }}
          appealy_discord_public_key: ${{ secrets.DISCORD_PUBLIC_KEY }}
          appealy_discord_client_id: ${{ secrets.DISCORD_CLIENT_ID }}
          appealy_discord_client_secret: ${{ secrets.DISCORD_CLIENT_SECRET }}
          appealy_ops_user_ids: ${{ secrets.OPS_USER_IDS }}
        run: |
          set -eu
          changed=0; same=0; skipped=0

          for var in appealy_discord_bot_token appealy_discord_application_id \
                     appealy_discord_public_key appealy_discord_client_id \
                     appealy_discord_client_secret appealy_ops_user_ids; do
            secret="$(echo "$var" | tr '_' '-')"
            value="$(printenv "$var" || true)"

            if [ -z "$value" ]; then
              echo "  $secret — no GitHub secret set, skipping"
              skipped=$((skipped+1))
              continue
            fi

            # Compared rather than blindly written: Secret Manager bills per
            # active version, and re-running this should be free when nothing
            # has changed.
            current="$(gcloud secrets versions access latest --secret="$secret" \
              --project="$P" 2>/dev/null || true)"

            if [ "$current" = "$value" ]; then
              echo "  $secret — already current"
              same=$((same+1))
            else
              # printf, not echo: echo would append a newline, and a bot token
              # with trailing whitespace fails Discord auth with an error that
              # never mentions whitespace.
              printf '%s' "$value" | gcloud secrets versions add "$secret" \
                --data-file=- --project="$P" >/dev/null
              echo "  $secret — updated"
              changed=$((changed+1))
            fi
          done

          echo
          echo "$changed updated, $same unchanged, $skipped not set in GitHub."
          if [ "$skipped" != "0" ]; then
            echo "::warning::$skipped secret(s) have no GitHub value. The deployment will not start without them."
          fi
