name: Deploy

# ---------------------------------------------------------------------------
# Builds all three images, then deploys the API and bot to the VM (deploy/vm/)
# and nginx to Cloud Run (deploy/service.yaml). scripts/deploy.sh does the
# rollout, and deploy/service.yaml says why the two are split.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: 'apply runs pending migrations first. skip leaves the schema alone. allow-destructive permits DROP/TRUNCATE.'
        required: true
        type: choice
        default: apply
        options: [apply, skip, allow-destructive]
      rehearse:
        description: 'Only while the bot is still on Cloud Run: set up the API on the VM and a new nginx with no traffic, test them, and stop before anything moves.'
        required: false
        type: boolean
        default: false

# A deploy is several steps on one VM, so a second one has to wait its turn. Mixing
# them could leave two bots or none.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VM_NAME: appealy-vm
  VM_ZONE: us-central1-c
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  # <project>:<region>:<instance>. Set as a repository variable so it is
  # visible in the workflow log rather than masked — it is not a secret, and a
  # masked value here makes a connection failure much harder to read.
  CLOUDSQL_CONNECTION_NAME: ${{ vars.CLOUDSQL_CONNECTION_NAME }}
  # The origin this deployment is reachable at. A repository variable so
  # pointing it at a real domain later is a settings change; also not a secret,
  # and masking a URL makes a redirect mismatch much harder to debug.
  PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      # The documentation is its own branch with no app code beside it. Checked
      # out here so web/Dockerfile can render it into the image — and so the
      # log records exactly which docs commit went live.
      - name: Check out the docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-content

      - name: Fail early if required secrets are missing
        env:
          A: ${{ secrets.PADDLE_API_KEY }}
          B: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          C: ${{ secrets.STATUS_HEARTBEAT_SECRET }}
        run: |
          missing=""
          if [ -z "$A" ]; then missing="$missing PADDLE_API_KEY"; fi
          if [ -z "$B" ]; then missing="$missing PADDLE_WEBHOOK_SECRET"; fi
          if [ -z "$C" ]; then missing="$missing STATUS_HEARTBEAT_SECRET"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "DEPLOYMENT_MODE=platform needs a billing source, or the containers would"
            echo "fail to start. Without the heartbeat secret the deploy would pass, and the"
            echo "status page would show the bot as down."
            exit 1
          fi
          if [ "${{ github.event.inputs.rehearse }}" = "true" ] && [ "${{ github.event.inputs.migrations }}" != "skip" ]; then
            echo "::error::A rehearsal must not change the schema. Use migrations=skip."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node
        if: github.event.inputs.migrations != 'skip'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json

      # Same reasoning as deploy-cloudrun.yml: additive changes must land
      # before the new revision serves, destructive ones are refused because
      # the safe order for those is deploy-then-migrate, done deliberately.
      - name: Apply database migrations
        if: github.event.inputs.migrations != 'skip'
        working-directory: api
        run: |
          set -eu
          # Statements that lose data: dropping a table or a column, or
          # emptying a table. "DROP NOT NULL" and "DROP DEFAULT" only relax a
          # rule, so they don't count. Files already read, approved and applied
          # are listed in db/migrations/reviewed-destructive.txt: without that,
          # every later deploy failed on the same old file forever.
          DESTRUCTIVE=$(grep -lE -i 'drop[[:space:]]+table|drop[[:space:]]+column|truncate' ../db/migrations/*.sql \
            | grep -vFf ../db/migrations/reviewed-destructive.txt || true)
          if [ -n "$DESTRUCTIVE" ]; then
            if [ "${{ github.event.inputs.migrations }}" != "allow-destructive" ]; then
              echo "::error::Destructive statements found. Re-run with migrations=allow-destructive after reading them, or skip."
              echo "$DESTRUCTIVE" | sed 's/^/  /'
              exit 1
            fi
            echo "::warning::Proceeding with destructive migrations at operator request."
          fi
          # `|| true` because the useful failure is "no versions yet", and
          # under bash -e gcloud's own non-zero exit kills the step before the
          # check below can say anything helpful. That is exactly what happened
          # on the first run: the operator got a raw NOT_FOUND stack instead of
          # being told which secret to populate.
          DATABASE_URL=$(gcloud secrets versions access latest             --secret=appealy-database-url --project="$GCP_PROJECT_ID" 2>/dev/null || true)
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::appealy-database-url has no value yet — the schema cannot be migrated."
            echo "Add one with:"
            echo "  echo -n 'postgres://...' | gcloud secrets versions add appealy-database-url --data-file=- --project=$GCP_PROJECT_ID"
            echo "Or re-run with migrations=skip to deploy without touching the schema."
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL

          # The runner cannot reach Cloud SQL directly — the instance has no
          # authorized networks, deliberately. The Auth Proxy authenticates to
          # Google with this workflow's own IAM identity, so no password
          # crosses the open internet and no IP range has to be trusted.
          #
          # TCP on 5432, matching the proxy sidecar in deploy/service.yaml —
          # so DATABASE_URL is one ordinary postgres:// string that works here,
          # in the containers, and on a laptop.
          #
          # The socket approach was tried first and does not work: postgres.js
          # takes its host from the URL's hostname and derives the socket path
          # from that containing a "/", which a URL cannot express. ?host= is
          # parsed into options but never consulted. Every socket-style URL
          # came back with path=false.
          curl -sSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$CLOUDSQL_CONNECTION_NAME" &
          PROXY_PID=$!
          trap 'kill $PROXY_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then break; fi
            if [ "$i" = "30" ]; then
              echo "::error::Cloud SQL proxy never accepted a connection on 5432"
              exit 1
            fi
            sleep 1
          done
          echo "Proxy ready."

          npm ci --omit=optional
          npm run db:migrate

      - name: Authorize Docker push
        run: gcloud auth configure-docker "$(echo "$ARTIFACT_REGISTRY" | cut -d'/' -f1)" --quiet

      # All three, tagged with the same commit. A single service holding
      # containers from different commits would be a genuinely confusing thing
      # to debug.
      - name: Build and push all three images
        run: |
          set -eu
          SHA="${{ github.sha }}"
          # REQUIRE_DOCS=1: web/Dockerfile refuses to build without docs-content/
          # rather than shipping a placeholder. api and bot ignore the arg.
          for svc in api web bot; do
            IMAGE="$ARTIFACT_REGISTRY/appealy-$svc:$SHA"
            echo "::group::build $svc"
            docker build --build-arg REQUIRE_DOCS=1 -f "$svc/Dockerfile" -t "$IMAGE" .
            docker push "$IMAGE"
            echo "::endgroup::"
          done

      - name: Deploy
        env:
          SHA: ${{ github.sha }}
          REVISION: appealy-web-${{ github.run_number }}-${{ github.run_attempt }}
          REHEARSE: ${{ github.event.inputs.rehearse }}
          # Paddle is the only payment provider, so these are checked by the
          # "fail early" step above rather than being allowed to arrive empty:
          # there is nothing left to fall back to, and a platform deployment
          # without them shows prices nobody can pay.
          # ENV and CHECKOUT_URL are variables, not secrets — neither is one.
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          PADDLE_ENV: ${{ vars.PADDLE_ENV }}
          PADDLE_CHECKOUT_URL: ${{ vars.PADDLE_CHECKOUT_URL }}
          PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          # Optional: unset, top.gg votes are refused and /vote has nothing to spend.
          TOPGG_WEBHOOK_SECRET: ${{ secrets.TOPGG_WEBHOOK_SECRET }}
          # Stored, not generated: it has to match the status Worker's
          # HEARTBEAT_SECRET, which lives on Cloudflare, not on the VM.
          STATUS_HEARTBEAT_SECRET: ${{ secrets.STATUS_HEARTBEAT_SECRET }}
        run: bash scripts/deploy.sh
