name: TEMP - list real GCP IAM users

# Delete this file once it has answered the question.

on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
      - uses: google-github-actions/setup-gcloud@v2
      # Each block runs independently and reports its own failure, rather than
      # the whole step dying on the first denied call — the first run hit
      # exactly that: get-iam-policy failed and artifact registry, which would
      # have worked, never even ran.
      - run: |
          echo "== authenticated as =="
          gcloud auth list --format="value(account)" || echo "(failed)"

          echo; echo "== artifact registry repos that actually exist =="
          gcloud artifacts repositories list --project=yahav-project-505809 2>&1 || echo "(failed / none)"

          echo; echo "== project IAM policy =="
          gcloud projects get-iam-policy yahav-project-505809 --format=json 2>&1 || echo "(failed — this identity likely lacks resourcemanager.projects.getIamPolicy)"

          echo; echo "== service accounts on the project =="
          gcloud iam service-accounts list --project=yahav-project-505809 2>&1 || echo "(failed)"

          echo; echo "== enabled APIs =="
          gcloud services list --enabled --project=yahav-project-505809 2>&1 || echo "(failed)"

          echo; echo "== this identity's own roles (what IT can do) =="
          gcloud projects get-iam-policy yahav-project-505809 --flatten="bindings[].members" --format="table(bindings.role)" --filter="bindings.members:$(gcloud auth list --format='value(account)')" 2>&1 || echo "(failed, same reason as the policy read above)"
