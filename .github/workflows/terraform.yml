name: Terraform (GCP infrastructure)

# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#
# terraform/ was written to be run from a laptop, which assumes a laptop with
# terraform and gcloud on it and credentials for the project. Running it here
# instead reuses the Workload Identity Federation this repo already has — the
# same auth the deploy workflow uses, no service account keys anywhere — so
# the infrastructure can be created without installing or authorising anything
# locally.
#
# STATE LIVES IN GCS, NOT ON A RUNNER
#
# A runner's disk is gone when the job ends. Terraform state on it would be
# lost immediately, and lost state means resources nothing can manage: the
# next run tries to create what already exists and fails. The bucket below is
# created if missing (versioned, so a bad apply can be rolled back) and the
# backend is configured at init time.
#
# This also fixes the same risk for local runs — state was previously a file
# on one machine, holding the generated database password in plaintext.
#
# IT NEEDS ITS OWN IDENTITY
#
# The deploy service account is deliberately least-privilege — run.admin,
# artifactregistry.writer, iam.serviceAccountUser (terraform/iam.tf). That is
# the right set for shipping a revision and the wrong set for creating a
# database, so Terraform cannot run as it and should not be given the rights
# to. Point TF_WORKLOAD_IDENTITY_PROVIDER / TF_SERVICE_ACCOUNT at an identity
# that can administer the project; the workflow falls back to the deploy
# credentials only so a first run fails at a legible place rather than at
# `auth`.
#
# PLAN IS THE DEFAULT, AND IT COSTS NOTHING
#
# `plan` reads and reports. `apply` creates billable resources — Cloud SQL
# above all — so it is never the default and never automatic. Read the plan
# before running it.
#
# TARGET EXISTS SO THE CHEAP HALF CAN GO FIRST
#
# The pieces here do not cost the same. Artifact Registry is pennies a month;
# Cloud SQL is the bill. But the deploy workflow needs the registry to exist
# before it can push an image at all, so with no way to create one without the
# other, "I want to push an image" quietly meant "I want a database" — and the
# registry not existing is exactly how that gets found out, as a
# `name unknown: Repository "appealy-repo" not found` at the end of a build
# that otherwise worked.
#
# So `target` narrows an apply to named resources. Leave it empty for
# everything. The one that unblocks a push:
#
#   google_artifact_registry_repository.appealy
#
# Terraform still owns whatever it creates, which is the point of doing this
# here rather than reaching for gcloud — a repository created out of band is
# one the next full apply tries to create again and fails on, and untangling
# that means a `terraform import` nobody remembers is needed.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'plan reads only. apply creates billable resources.'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      target:
        description: 'Optional. Limit to one resource, e.g. google_artifact_registry_repository.appealy. Empty means everything.'
        required: false
        type: string
        default: ''

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  terraform:
    name: terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Workload Identity Federation

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail early if the project id is not set
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::Repository variable GCP_PROJECT_ID is not set."
            echo "Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.TF_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.TF_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure the state bucket exists
        run: |
          # Bucket names are globally unique, so the project id is part of it.
          BUCKET="${GCP_PROJECT_ID}-appealy-tfstate"
          if gcloud storage buckets describe "gs://${BUCKET}" >/dev/null 2>&1; then
            echo "State bucket already exists: gs://${BUCKET}"
          else
            echo "Creating state bucket gs://${BUCKET}"
            gcloud storage buckets create "gs://${BUCKET}" \
              --project="${GCP_PROJECT_ID}" \
              --location="${GCP_REGION}" \
              --uniform-bucket-level-access
            # Versioned on purpose: state is the only record of what exists,
            # and an overwrite with no history is unrecoverable.
            gcloud storage buckets update "gs://${BUCKET}" --versioning
          fi
          echo "TF_STATE_BUCKET=${BUCKET}" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=prod"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        env:
          TF_TARGET: ${{ github.event.inputs.target }}
        run: |
          # Built as an array so an empty target contributes no argument
          # at all. An unquoted `-target=` with nothing after it is not
          # the same as omitting it: terraform reads it as targeting the
          # empty address and plans nothing, which reads exactly like a
          # clean no-op plan and is how you apply nothing while believing
          # you applied something.
          ARGS=(-var="project_id=${GCP_PROJECT_ID}" -var="region=${GCP_REGION}" -out=tfplan)
          if [ -n "$TF_TARGET" ]; then
            echo "::warning::Targeted plan: only $TF_TARGET and what it depends on. The rest of the infrastructure is untouched AND unreported — this plan is not a statement about it."
            ARGS+=(-target="$TF_TARGET")
          fi
          terraform plan "${ARGS[@]}"
          echo "--- summary ---"
          terraform show -no-color tfplan | tail -40

      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: terraform/tfplan
          retention-days: 14

      # Applies the plan that was just shown, not a fresh one — so what runs is
      # what was reviewed, and a change landing in between cannot slip in.
      - name: Terraform apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Outputs
        if: github.event.inputs.action == 'apply'
        run: terraform output
