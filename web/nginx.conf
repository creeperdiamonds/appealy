# Served through nginx's envsubst templating (/etc/nginx/templates), so
# ${PORT}, ${API_ORIGIN} and ${DNS_RESOLVER} are replaced at container start.
# Cloud Run assigns the port at runtime and the container must listen on it — a
# hardcoded 80 makes the service fail its health check with no useful error.
#
# ---------------------------------------------------------------------------
# WHY THE API IS PROXIED HERE RATHER THAN CALLED DIRECTLY FROM THE BROWSER
#
# The session cookie is SameSite=Lax (api/src/routes/auth.ts). A Lax cookie is
# attached to a cross-ORIGIN request only when that request is same-SITE, and
# "site" means registrable domain — not origin. Serving the console from one
# host and calling the API on another therefore means the browser never sends
# the cookie on a fetch(), and every authenticated request 401s.
#
# CORS does not fix this and never could: CORS decides whether a response may
# be READ, SameSite decides whether the cookie is ATTACHED in the first place.
# Getting CORS right and the cookie wrong produces a clean 200 on the OPTIONS
# preflight followed by a 401 on the real request, which reads as a session
# bug rather than a cookie-scoping one.
#
# This bites hardest on exactly the deployment path terraform/ provisions.
# Cloud Run's default hostnames are appealy-web-*.run.app and
# appealy-api-*.run.app, and `run.app` is on the Public Suffix List — which
# makes those two DIFFERENT SITES, not two hosts of one site. Login appears to
# succeed and every request after it is anonymous.
#
# Local development hides the whole problem: localhost:5173 and localhost:3001
# differ only by port, ports are not part of a site, so the cookie flows and
# everything works right up until it is deployed.
#
# Proxying the API's own path prefixes through this server means the browser
# only ever talks to one origin. The cookie is first-party by construction,
# SameSite=Lax stays correct (rather than being relaxed to SameSite=None, which
# would work today and be blocked by Safari and Firefox as a third-party
# cookie), and CORS stops being load-bearing.
#
# Only /auth/ and /api/ are proxied. /webhooks (Stripe) and /health (Cloud
# Run's probe) are hit directly on the API service and deliberately are not
# reachable through the console.
# ---------------------------------------------------------------------------

server {
  # default_server is load-bearing now that a second server block exists
  # below. It keeps every Host that is NOT the apex answering exactly as it
  # does today: the Appealy subdomain, the run.app URL, and Cloud Run's
  # health probe, which arrives with no Host worth matching.
  #
  # Without it, nginx falls back to the FIRST block in the file — which
  # would work by accident today and break the moment the blocks are
  # reordered.
  listen ${PORT} default_server;
  root /usr/share/nginx/html;
  index index.html;

  # Resolved per-request rather than once at startup: proxy_pass with a
  # variable forces runtime DNS, so a backend that changes address does not
  # need an nginx restart to be noticed.
  resolver ${DNS_RESOLVER} valid=30s ipv6=off;

  # Redirects must be relative, or nginx builds them from what IT is listening
  # on rather than what the client asked for. Behind Cloud Run that means
  # `location = /dashboard` answered with
  # http://appealy.creeperdiamonds.xyz:8080/dashboard/ — nginx's own port, and
  # http because TLS was terminated upstream. Following that link leaves the
  # site entirely, on a port nothing serves.
  #
  # A relative Location ("/dashboard/") lets the browser keep the scheme, host
  # and port it already has, which is always right and needs no knowledge of
  # the proxy in front.
  absolute_redirect off;
  set $api_origin ${API_ORIGIN};

  # Hashed asset filenames are immutable, so they can be cached hard. Under
  # /dashboard/ because that is where the console's base puts them.
  location /dashboard/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The console. Any path under here that isn't a real file is the SPA's own
  # routing, so it falls back to the console's index rather than to the
  # marketing site's — landing on a marketing page because of a typo in a
  # dashboard URL would be a strange way to find out you mistyped.
  # Exact match, so /dashboard normalises to /dashboard/ before the block
  # below sees it. The console's assets are built against a base of
  # /dashboard/, and a page served from the unslashed path resolves them one
  # directory too high.
  location = /dashboard {
    # 302, not 301.
    #
    # A 301 is cached by browsers indefinitely — that is what "permanent"
    # means — so the one this served briefly with nginx's own port in it
    # (http://host:8080/dashboard/) is still stuck in the cache of everyone
    # who clicked it, and no server-side fix reaches them. They have to clear
    # it themselves, which is not a thing you can ask users to do.
    #
    # The canonicalisation is worth almost nothing here: the dashboard is an
    # authenticated app, not an indexed page, so there is no SEO value being
    # traded away. A redirect that cannot poison a cache is worth far more
    # than one that ranks slightly better.
    return 302 /dashboard/;
  }

  location /dashboard/ {
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    try_files $uri $uri/ /dashboard/index.html;
  }

  # The public status page, kept at its own path and independent of both.
  location /status {
    try_files $uri $uri/ /status/index.html;
  }

  # Neither index may be cached, or a deploy leaves browsers loading an old
  # shell that references asset filenames no longer on disk.
  #
  # COOP is repeated per location on purpose: an add_header in a location block
  # replaces the inherited set rather than adding to it, so a header declared
  # only at server level would silently vanish from exactly the response that
  # needs it.
  location = /dashboard/index.html {
    add_header Cache-Control "no-cache";
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The marketing site. Static files, extensionless URLs resolved to .html so
  # /pricing serves pricing.html, and a real 404 for anything missing — an
  # unknown marketing path is a broken link, not a route, and answering it with
  # the home page hides that from whoever has to fix it.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # --- API passthrough ------------------------------------------------------
  # No path rewriting: the API already mounts these exact prefixes
  # (api/src/app.ts), and the console's hash routing means neither can ever
  # collide with a frontend route.
  location /auth/ {
    proxy_pass $api_origin;
    include /etc/nginx/appealy-proxy.conf;
  }

  location /api/ {
    proxy_pass $api_origin;
    include /etc/nginx/appealy-proxy.conf;
  }

  # Tebex's payment callbacks. Mounted at /webhooks in api/src/app.ts and
  # missing from this file until now, so the request landed in `location /`
  # above and got a 404 from try_files.
  #
  # That is the worst possible place for it to break, because nothing visible
  # fails: checkout completes, the customer is charged, Tebex posts the event,
  # nginx answers 404, and the plan never activates. .env.example warns about
  # exactly this outcome for a missing TEBEX_WEBHOOK_SECRET — the same silence
  # was reachable with the secret set perfectly, one layer further out.
  #
  # Tebex retries a failed delivery, so the window is survivable if this is
  # fixed quickly. It is not survivable if nobody knows to look here.
  location /webhooks/ {
    proxy_pass $api_origin;
    include /etc/nginx/appealy-proxy.conf;
  }
}

# ---------------------------------------------------------------------------
# The apex, creeperdiamonds.xyz.
#
# Same container, same port, different root — split on Host rather than run
# as a second Cloud Run service, because a personal page has no traffic worth
# insulating and a second service is another image, another deploy path, and
# another thing to forget to update.
#
# Deliberately proxies NOTHING. No /api/, no /auth/, no /dashboard/. The page
# has no reason to reach the API, and not proxying it means a misconfigured
# apex cannot become a second, unintended door to the console.
# ---------------------------------------------------------------------------
server {
  listen ${PORT};
  server_name creeperdiamonds.xyz;
  root /usr/share/nginx/html/home;
  index index.html;

  # The main block has no server-wide add_header of its own — Cache-Control
  # "no-cache" on /index.html and the dashboard's COOP header are both set
  # per-location, not inherited from the server level. There is nothing to
  # match at the server level, so this block sets nothing there either.
  # COOP is skipped entirely: "same-origin-allow-popups" exists for the
  # console's OAuth popup flow, which this static page does not have, and
  # applying it here would be copying an unrelated header rather than the
  # marketing site's actual policy.
  #
  # What IS copied is the one thing the marketing site's own /index.html
  # gets: no-cache, so a deploy never leaves a browser holding a stale shell
  # that references assets no longer on disk.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
