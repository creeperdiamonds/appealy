# Served through nginx's envsubst templating (/etc/nginx/templates), so
# ${PORT}, ${API_ORIGIN} and ${DNS_RESOLVER} are replaced at container start.
# Cloud Run assigns the port at runtime and the container must listen on it — a
# hardcoded 80 makes the service fail its health check with no useful error.
#
# ---------------------------------------------------------------------------
# WHY THE API IS PROXIED HERE RATHER THAN CALLED DIRECTLY FROM THE BROWSER
#
# The session cookie is SameSite=Lax (api/src/routes/auth.ts). A Lax cookie is
# attached to a cross-ORIGIN request only when that request is same-SITE, and
# "site" means registrable domain — not origin. Serving the console from one
# host and calling the API on another therefore means the browser never sends
# the cookie on a fetch(), and every authenticated request 401s.
#
# CORS does not fix this and never could: CORS decides whether a response may
# be READ, SameSite decides whether the cookie is ATTACHED in the first place.
# Getting CORS right and the cookie wrong produces a clean 200 on the OPTIONS
# preflight followed by a 401 on the real request, which reads as a session
# bug rather than a cookie-scoping one.
#
# This bites hardest on exactly the deployment path terraform/ provisions.
# Cloud Run's default hostnames are appealy-web-*.run.app and
# appealy-api-*.run.app, and `run.app` is on the Public Suffix List — which
# makes those two DIFFERENT SITES, not two hosts of one site. Login appears to
# succeed and every request after it is anonymous.
#
# Local development hides the whole problem: localhost:5173 and localhost:3001
# differ only by port, ports are not part of a site, so the cookie flows and
# everything works right up until it is deployed.
#
# Proxying the API's own path prefixes through this server means the browser
# only ever talks to one origin. The cookie is first-party by construction,
# SameSite=Lax stays correct (rather than being relaxed to SameSite=None, which
# would work today and be blocked by Safari and Firefox as a third-party
# cookie), and CORS stops being load-bearing.
#
# Only /auth/ and /api/ are proxied. /webhooks (Stripe) and /health (Cloud
# Run's probe) are hit directly on the API service and deliberately are not
# reachable through the console.
# ---------------------------------------------------------------------------

server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;

  # Resolved per-request rather than once at startup: proxy_pass with a
  # variable forces runtime DNS, so a backend that changes address does not
  # need an nginx restart to be noticed.
  resolver ${DNS_RESOLVER} valid=30s ipv6=off;
  set $api_origin ${API_ORIGIN};

  # Hashed asset filenames are immutable, so they can be cached hard. Under
  # /dashboard/ because that is where the console's base puts them.
  location /dashboard/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The console. Any path under here that isn't a real file is the SPA's own
  # routing, so it falls back to the console's index rather than to the
  # marketing site's — landing on a marketing page because of a typo in a
  # dashboard URL would be a strange way to find out you mistyped.
  location /dashboard {
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    try_files $uri $uri/ /dashboard/index.html;
  }

  # The public status page, kept at its own path and independent of both.
  location /status {
    try_files $uri $uri/ /status/index.html;
  }

  # Neither index may be cached, or a deploy leaves browsers loading an old
  # shell that references asset filenames no longer on disk.
  #
  # COOP is repeated per location on purpose: an add_header in a location block
  # replaces the inherited set rather than adding to it, so a header declared
  # only at server level would silently vanish from exactly the response that
  # needs it.
  location = /dashboard/index.html {
    add_header Cache-Control "no-cache";
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The marketing site. Static files, extensionless URLs resolved to .html so
  # /pricing serves pricing.html, and a real 404 for anything missing — an
  # unknown marketing path is a broken link, not a route, and answering it with
  # the home page hides that from whoever has to fix it.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # --- API passthrough ------------------------------------------------------
  # No path rewriting: the API already mounts these exact prefixes
  # (api/src/app.ts), and the console's hash routing means neither can ever
  # collide with a frontend route.
  location /auth/ {
    proxy_pass $api_origin;
    include /etc/nginx/appealy-proxy.conf;
  }

  location /api/ {
    proxy_pass $api_origin;
    include /etc/nginx/appealy-proxy.conf;
  }
}
