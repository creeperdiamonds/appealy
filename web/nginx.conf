server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames are immutable, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or a deploy leaves browsers loading an
  # old shell that references asset filenames no longer on disk.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The console routes on the hash, so every path resolves to the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
