<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Both grounds ship, so the shell must not assert one. `dark light`
         orders the preference without excluding the other; a bare "dark" here
         made the browser paint native controls and the scrollbar dark even
         when the user is on the light theme. -->
    <meta name="color-scheme" content="dark light" />
    <!-- The first frame, before any script runs. src/lib/theme.ts rewrites the
         content of this tag on load and on every switch — but until it does,
         these are what the browser's address bar uses, and a missing tag means
         a white strip above a dark app for as long as the bundle takes to
         parse. Values track --bg for each ground in src/index.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1016" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f8" />
    <title>Appealy Console</title>
    <!-- Relative, not root-absolute: the console is served under /dashboard/,
         and a "/favicon.svg" here would resolve against the marketing site at
         the root instead. There was no favicon at all before, so every tab
         showed the browser's broken-document placeholder. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="description" content="Appealy console — configure applications, tickets, appeals and moderation for your Discord server." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Horizontal-overflow probe. INERT unless the URL carries ?overflow.

      It exists because the failing device is a phone and the developer is not
      holding it. Reproducing a 360px viewport elsewhere kept failing — an
      artifact sandbox blocks writing into an iframe, and without an iframe
      there is no second viewport to measure in — so the page reports on
      itself instead, at the width where it actually breaks.

      The technique is the standard one: walk every element, compare its
      bounding box against the documentElement's client width, and mark the
      ones that pass the right edge. Outermost first, because a child sticking
      out is usually a symptom of the ancestor that would not shrink.

      Guarded rather than removed after use. It costs nothing when the flag is
      absent, and the next person to hit this will not have to rebuild it.
    -->
    <script>
      (function () {
        if (window.location.search.indexOf("overflow") === -1) return;

        var panel = document.createElement("div");
        panel.id = "overflow-probe";
        panel.style.cssText =
          "position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#000;" +
          "color:#0f0;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;" +
          "padding:8px;max-height:50vh;overflow:auto;border-top:2px solid #0f0;white-space:pre-wrap";
        document.body.appendChild(panel);

        function label(el) {
          var c = typeof el.className === "string" && el.className.trim()
            ? "." + el.className.trim().split(/\s+/).slice(0, 3).join(".")
            : "";
          return el.tagName.toLowerCase() + c;
        }

        function scan() {
          var de = document.documentElement;
          var vw = de.clientWidth;
          var over = de.scrollWidth - vw;
          var lines = [
            "viewport " + vw + "  scrollWidth " + de.scrollWidth + "  OVERFLOW " + over + "px",
            ""
          ];

          document.querySelectorAll("[data-of]").forEach(function (el) {
            el.style.outline = "";
            el.removeAttribute("data-of");
          });

          if (over <= 0) {
            lines.push("No horizontal overflow at this width.");
          } else {
            var hits = [];
            document.querySelectorAll("body *").forEach(function (el) {
              if (el.id === "overflow-probe" || panel.contains(el)) return;
              var r = el.getBoundingClientRect();
              if (r.width > 0 && r.right > vw + 1) hits.push({ el: el, r: r });
            });
            hits.slice(0, 12).forEach(function (h, i) {
              h.el.style.outline = i === 0 ? "3px solid #ff0" : "1px dashed #f0f";
              h.el.setAttribute("data-of", "1");
              lines.push(
                (i === 0 ? "> " : "  ") + label(h.el) +
                "  w=" + Math.round(h.r.width) +
                " right=" + Math.round(h.r.right)
              );
            });
            lines.push("");
            lines.push("The FIRST line, outlined yellow, is the one to fix.");

            // Where did that width come from? A box can only be wider than the
            // viewport because something gave it the room, so walk up from the
            // offender printing each ancestor's width. The first ancestor that
            // is NOT overflowing is the one whose child broke out of it, and
            // that boundary is the actual bug.
            if (hits.length) {
              lines.push("");
              lines.push("ancestor chain (width / clientWidth / display):");
              var el = hits[0].el;
              while (el && el !== document.documentElement) {
                var cs = getComputedStyle(el);
                lines.push(
                  "  " + label(el) +
                  "  w=" + Math.round(el.getBoundingClientRect().width) +
                  " client=" + el.clientWidth +
                  " " + cs.display +
                  (cs.flexDirection !== "row" ? "/" + cs.flexDirection : "") +
                  " minW=" + cs.minWidth
                );
                el = el.parentElement;
              }

              lines.push("");
              lines.push("children of the offender:");
              Array.prototype.forEach.call(hits[0].el.children, function (c) {
                var cr = c.getBoundingClientRect();
                var ccs = getComputedStyle(c);
                lines.push(
                  "  " + label(c) +
                  "  w=" + Math.round(cr.width) +
                  " flex=" + ccs.flex +
                  " maxW=" + ccs.maxWidth
                );
              });
            }
          }

          panel.textContent = lines.join("\n");
        }

        window.addEventListener("resize", scan);
        // The console is a single-page app, so the DOM changes without a
        // navigation. Re-scan on a timer rather than guessing at router hooks.
        setInterval(scan, 1500);
        setTimeout(scan, 800);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
