# web/appealy-proxy.conf
#
# Shared proxy settings for the /auth/ and /api/ passthroughs in nginx.conf.
# See the header of that file for why the API is proxied through the console
# origin at all — the short version is that the session cookie is SameSite=Lax
# and only a single origin keeps it first-party.

proxy_http_version 1.1;

# Cloud Run routes on SNI. Without this, the TLS handshake to a *.run.app
# backend fails before any HTTP is exchanged, and the error says nothing about
# SNI.
proxy_ssl_server_name on;

# Deliberately $proxy_host (the backend's hostname), NOT $host. Cloud Run
# routes requests by Host header, so forwarding the console's hostname reaches
# Google's frontend and returns a 404 that looks like the API is missing
# routes. The API itself never reads Host — every URL it builds comes from
# FRONTEND_ORIGIN or DISCORD_REDIRECT_URI — so nothing downstream needs it.
proxy_set_header Host $proxy_host;

proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The OAuth callback answers with Set-Cookie plus a 302 to FRONTEND_ORIGIN.
# Rewriting that Location would point it back at the backend's own hostname
# and break the round trip, so it is passed through exactly as sent.
proxy_redirect off;

# Cookies are likewise passed through untouched. The API sets no Domain
# attribute, so the browser scopes the cookie to the console's host — which is
# the entire point of proxying.

# The OAuth callback waits on Discord's token exchange plus a user fetch, both
# of which are someone else's latency. The default 60s read timeout is enough,
# but connect is tightened so an unreachable backend fails fast instead of
# holding the request open.
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
