version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appealy
      POSTGRES_PASSWORD: appealy
      POSTGRES_DB: appealy
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Loopback only. Published so you can psql from the host during
      # development; NOT published to the LAN, because the password here is
      # literally "appealy" and a home network with a permissive firewall
      # would otherwise expose it. Change to "5432:5432" only if you
      # genuinely need remote access, and change the password first.
      - "127.0.0.1:5432:5432"
    networks:
      - appealy_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appealy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - appealy_internal

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://appealy:appealy@postgres:5432/appealy
      REDIS_URL: redis://redis:6379
      BOT_INTERNAL_PORT: 9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - appealy_internal
    # BOT_INTERNAL_PORT (control server) is intentionally NOT published to
    # the host — only the api service reaches it, over the private network.

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://appealy:appealy@postgres:5432/appealy
      REDIS_URL: redis://redis:6379
      BOT_INTERNAL_URL: http://bot:9090
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      bot:
        condition: service_started
    networks:
      - appealy_internal

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Empty on purpose. nginx inside this container proxies /auth and /api
        # to the api service, so the bundle calls them as same-origin relative
        # paths and the session cookie stays first-party. Pointing this at
        # http://localhost:3001 makes the console a separate origin from the
        # API, which happens to work on localhost (same site, different port)
        # and stops working the moment the two are deployed to real hostnames.
        # See web/nginx.conf.
        VITE_API_URL: ""
    environment:
      # Runtime config for the nginx proxy, not baked into the bundle.
      # Reaches the api service over the internal network. Port 3001 is still
      # published on the host for direct API calls (curl, Stripe CLI), but the
      # browser should never use it — go through http://localhost:5173.
      API_ORIGIN: http://api:3001
      # Docker's embedded DNS, needed because nginx resolves the proxy target
      # at request time. Cloud Run uses a different resolver; see web/Dockerfile.
      DNS_RESOLVER: 127.0.0.11
    restart: unless-stopped
    ports:
      # Container now listens on ${PORT}, defaulting to 8080 — see
      # web/Dockerfile. Host port unchanged, so http://localhost:5173 still
      # works exactly as before.
      - "5173:8080"
    depends_on:
      - api
    networks:
      - appealy_internal

networks:
  appealy_internal:
    driver: bridge

volumes:
  pg_data:
