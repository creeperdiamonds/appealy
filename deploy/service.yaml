# deploy/service.yaml
#
# One Cloud Run service running the whole product: nginx as the ingress
# container, the API and the bot alongside it as sidecars.
#
# WHY ONE SERVICE
#
# Everything talks over localhost, because containers in a Cloud Run service
# share a network namespace. That removes real machinery rather than just
# moving it:
#
#   nginx -> api    was a proxy_pass to a *.run.app URL, which needed a runtime
#                   DNS resolver, proxy_ssl_server_name for SNI, and a Host
#                   header rewritten to $proxy_host. Now it is 127.0.0.1:3001.
#   api   -> bot    was an HTTP call to BOT_INTERNAL_URL guarded by a shared
#                   secret crossing the network. Now it is 127.0.0.1:9090.
#
# It also fixes the class of bug that produced the /webhooks 404: a prefix
# missing from nginx's proxy list only mattered because the API lived somewhere
# else.
#
# THE SCALING CONSTRAINT IS NOT OPTIONAL
#
# maxScale is 1 and cpu-throttling is off, and both are load-bearing because
# the bot is in here:
#
#   maxScale=1        Cloud Run adds instances in response to HTTP traffic. A
#                     second instance means a second Discord gateway connection
#                     on the same token, and every event handled twice — two
#                     role grants, two DMs, two accepted appeals. Someone
#                     loading the pricing page must not be able to cause that.
#   cpu-throttling    Outside request handling Cloud Run throttles CPU to
#     = false         near zero. A gateway connection needs CPU for heartbeats;
#                     throttled, Discord drops it.
#   minScale=1        Nothing to serve the gateway if the instance is gone.
#
# The cost of that is continuous CPU billing, which is the trade being made
# deliberately. Watch the actual bill for a few days rather than trusting an
# estimate — Cloud Run bills per second, so this is cheap to be wrong about.
#
# THE CONSEQUENCE TO KNOW
#
# maxScale=1 means the API cannot scale out. At present traffic that is
# irrelevant; if the dashboard ever gets busy, the honest fix is to move the
# bot to its own host and lift the cap, not to raise maxScale and hope.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: appealy
  labels:
    managed-by: github-actions
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Runs as a dedicated identity holding exactly two roles:
      # cloudsql.client and secretmanager.secretAccessor.
      #
      # Without this, Cloud Run uses the default compute service account, which
      # carries roles/editor over the whole project — so a compromised
      # container could create, modify or delete almost any resource in it.
      # Here the blast radius is reading its own secrets and talking to its own
      # database, which is all the app has ever needed.
      serviceAccountName: appealy-runtime@yahav-project-505809.iam.gserviceaccount.com

      # Generous, because three containers share it. The bot is the one that
      # actually needs headroom — a large guild's member cache is not small.
      containerConcurrency: 80
      containers:
        # ------------------------------------------------------------------
        # Cloud SQL Auth Proxy.
        #
        # Here because postgres.js cannot reach a unix socket from a connection
        # URL. Its host comes from the URL's hostname and the socket path is
        # derived from that containing a "/", which no URL can express — the
        # ?host= query parameter is read into options but never consulted for
        # the host. Verified empirically: every socket-style URL produced
        # path=false and host=["localhost"].
        #
        # Changing that would mean teaching three separate call sites (the API
        # client, the bot client, and drizzle.config.ts) to pass an options
        # object instead of a string. A proxy listening on TCP keeps
        # DATABASE_URL an ordinary postgres:// string that works unchanged
        # here, in CI, and on a laptop — the app stays portable and the
        # awkwardness stays in the infrastructure where it belongs.
        #
        # It authenticates to Google with the service's own IAM identity, so
        # the instance still needs no authorized networks and no password
        # crosses the open internet.
        # ------------------------------------------------------------------
        - name: cloudsql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - "--port=5432"
            # Without this the proxy binds 127.0.0.1 only, which is what we
            # want — containers in an instance share the loopback interface.
            - "--auto-iam-authn=false"
            - "CLOUDSQL_CONNECTION_NAME"
          # Nothing else may start before the database is reachable, or the API
          # and bot spend their first seconds crash-looping on connection
          # refused.
          startupProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 2
            failureThreshold: 30
          resources:
            limits:
              cpu: "100m"
              memory: 128Mi

        # ------------------------------------------------------------------
        # Ingress. The only container with a port exposed to Cloud Run, so it
        # is what traffic routes to; the rest are reachable only from inside
        # the instance.
        # ------------------------------------------------------------------
        - name: web
          image: IMAGE_WEB
          ports:
            - name: http1
              containerPort: 8080
          env:
            # PORT is deliberately absent. Cloud Run injects it into the
            # INGRESS container automatically, from containerPort above, and
            # rejects the deployment outright if the spec also sets it. nginx
            # still gets it — web/nginx.conf reads ${PORT} at container start
            # and Cloud Run has already put it there.
            #
            # The API sidecar below does set PORT, and that is fine: Cloud Run
            # only reserves it for the container it routes traffic to.
            # Was a *.run.app URL. Same instance now.
            - name: API_ORIGIN
              value: "http://127.0.0.1:3001"
            # nginx.conf resolves proxy targets at request time, which needs a
            # resolver when the target is a hostname. 127.0.0.1 is not, but the
            # directive is still parsed, so it is given something valid.
            - name: DNS_RESOLVER
              value: "169.254.169.254"
          resources:
            limits:
              cpu: "150m"
              memory: 256Mi

        # ------------------------------------------------------------------
        # API. No ports block — sidecars are not routable from outside.
        # ------------------------------------------------------------------
        - name: api
          image: IMAGE_API
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: production
            - name: APPEALY_ENV
              value: production
            - name: DEPLOYMENT_MODE
              value: platform
            - name: LOG_LEVEL
              value: info
            - name: BOT_INTERNAL_URL
              value: "http://127.0.0.1:9090"
            # Guards the bot's control server. Still set even though the call
            # never leaves the instance — the server checks it unconditionally,
            # and an unauthenticated internal endpoint that happens to be
            # unreachable today is a bad thing to leave lying around.
            - name: INTERNAL_RPC_SECRET
              value: "INTERNAL_RPC_SECRET_VALUE"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: appealy-database-url, key: latest } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: appealy-redis-url, key: latest } }
            - name: DISCORD_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: appealy-discord-bot-token, key: latest } }
            - name: DISCORD_APPLICATION_ID
              valueFrom: { secretKeyRef: { name: appealy-discord-application-id, key: latest } }
            - name: DISCORD_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: appealy-discord-public-key, key: latest } }
            - name: DISCORD_CLIENT_ID
              valueFrom: { secretKeyRef: { name: appealy-discord-client-id, key: latest } }
            - name: DISCORD_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: appealy-discord-client-secret, key: latest } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: appealy-session-secret, key: latest } }
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: appealy-token-encryption-key, key: latest } }
            - name: OPS_USER_IDS
              valueFrom: { secretKeyRef: { name: appealy-ops-user-ids, key: latest } }
            # Substituted at deploy time from GitHub secrets. See the workflow.
            - name: TEBEX_PROJECT_ID
              value: "TEBEX_PROJECT_ID_VALUE"
            - name: TEBEX_PRIVATE_KEY
              value: "TEBEX_PRIVATE_KEY_VALUE"
            - name: TEBEX_WEBHOOK_SECRET
              value: "TEBEX_WEBHOOK_SECRET_VALUE"
          resources:
            limits:
              cpu: "750m"
              memory: 768Mi

        # ------------------------------------------------------------------
        # Bot. Holds the Discord gateway connection; see the scaling note above
        # for why this container is the reason maxScale is pinned.
        # ------------------------------------------------------------------
        - name: bot
          image: IMAGE_BOT
          env:
            - name: BOT_INTERNAL_PORT
              value: "9090"
            - name: APPEALY_ENV
              value: production
            - name: DEPLOYMENT_MODE
              value: platform
            - name: LOG_LEVEL
              value: info
            - name: INTERNAL_RPC_SECRET
              value: "INTERNAL_RPC_SECRET_VALUE"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: appealy-database-url, key: latest } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: appealy-redis-url, key: latest } }
            - name: DISCORD_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: appealy-discord-bot-token, key: latest } }
            - name: DISCORD_APPLICATION_ID
              valueFrom: { secretKeyRef: { name: appealy-discord-application-id, key: latest } }
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: appealy-token-encryption-key, key: latest } }
            - name: TEBEX_PROJECT_ID
              value: "TEBEX_PROJECT_ID_VALUE"
            - name: TEBEX_PRIVATE_KEY
              value: "TEBEX_PRIVATE_KEY_VALUE"
            - name: TEBEX_WEBHOOK_SECRET
              value: "TEBEX_WEBHOOK_SECRET_VALUE"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
      # ------------------------------------------------------------------
      # SIZING NOTE
      #
      # An instance's CPU is the SUM of its containers' limits, not the max —
      # so the first version of this file, with cpu "1" on all three, asked for
      # a 3 vCPU instance. With cpu-throttling off and minScale 1 that is three
      # always-allocated vCPUs billed around the clock, for a service with no
      # users yet.
      #
      # 100m + 150m + 750m + 1 = 2 vCPU. The bot keeps a full core because it
      # is the only container doing continuous work; nginx and the proxy are
      # near-idle, and the API is idle except when somebody loads a page.
      #
      # If the bill still looks wrong, halving these is the first thing to try
      # — at present traffic 1 vCPU total would very likely do.
      # ------------------------------------------------------------------
