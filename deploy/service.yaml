# deploy/service.yaml
#
# The public web server: nginx on Cloud Run. It serves the site, the dashboard's
# files and the docs, and passes /api/, /auth/ and /webhooks/ to the API. The API
# and the bot run on a small VM, see deploy/vm/.
#
# WHY THEY ARE SPLIT
#
# The bot holds a Discord gateway connection open all day, so it needs CPU that's
# always on. Cloud Run's lowest setting for that is 1 vCPU and 1 GiB around the
# clock, about $50 a month, while the whole product uses about 15 mCPU and 320 MiB.
# An e2-micro is enough for that and falls within Compute Engine's free tier.
#
# nginx is the opposite. It only does anything while a request is in progress,
# about 30,000 seconds a month, so here it scales to zero and stays within Cloud
# Run's free tier. See "Measured resource use" in SCALING.md for the numbers.
#
# Keeping it here rather than moving it too means the domain mappings, their
# certificates and Google's front end stayed exactly as they were: moving the bot
# changed no address and no DNS record. It also means the site, the docs and the
# privileged intents review pages stay up if the VM is down, and the dashboard's
# requests get the readable "not answering right now" reply from web/nginx.conf.
#
# THE PRIVATE LINK
#
# The network-interfaces annotation gives this service an address inside the VPC,
# so it reaches the VM on its private address, and the API has no public port.
# private-ranges-only sends just that traffic through the VPC. Google's docs warn
# that a new instance can take a while to get this connection going, so scripts/
# deploy.sh retries before it decides a new revision is broken. In practice
# requests arrive often enough that an instance is rarely cold.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: appealy
  labels:
    managed-by: github-actions
spec:
  template:
    metadata:
      # Named so that scripts/deploy.sh can refer to it before it takes traffic.
      name: REVISION_NAME_VALUE
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      # An identity with no roles. nginx holds no secrets and calls no Google API,
      # so if it were ever compromised there is nothing for it to reach.
      serviceAccountName: appealy-web@yahav-project-505809.iam.gserviceaccount.com
      containerConcurrency: 80
      containers:
        - name: web
          image: IMAGE_WEB
          ports:
            - name: http1
              containerPort: 8080
          env:
            # PORT is deliberately absent. Cloud Run injects it into the container
            # automatically, from containerPort above, and rejects the deployment
            # outright if the spec also sets it. web/nginx.conf reads ${PORT} at
            # container start.
            #
            # The VM's fixed private address, reserved as appealy-vm-internal. See
            # deploy/vm/README.md.
            - name: API_ORIGIN
              value: "http://10.128.0.10:3001"
            # nginx.conf resolves proxy targets at request time, which needs a
            # resolver when the target is a hostname. An address is not one, but
            # the directive is still parsed, so it is given something valid.
            - name: DNS_RESOLVER
              value: "169.254.169.254"
          # 1 vCPU because below that Cloud Run requires a concurrency of 1, which
          # would start another instance for each simultaneous request. It's only
          # billed while a request is in progress. nginx uses about 30 MiB.
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
